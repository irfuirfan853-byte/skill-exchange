{% extends "base.html" %}
{% block title %}Log in — Skill Exchange{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card">
    <a href="{{ url_for('home') }}" class="logo">
      <div class="logo-badge">⇄</div>
      Skill<span class="logo-accent">Exchange</span>
    </a>
    <h1>Welcome back</h1>
    <p class="sub">Log in to see your dashboard and skill exchanges.</p>

    <div class="auth-tabs">
      <a href="{{ url_for('login') }}" class="active">Log in</a>
      <a href="{{ url_for('signup') }}">Sign up</a>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-foot">New here? <a href="{{ url_for('signup') }}">Create a free account</a></p>
  </div>
</div>

{% endblock %}
