{% extends "base.html" %}
{% block title %}Sign up — Skill Exchange{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card">
    <a href="{{ url_for('home') }}" class="logo">
      <div class="logo-badge">⇄</div>
      Skill<span class="logo-accent">Exchange</span>
    </a>
    <h1>Create your account</h1>
    <p class="sub">Give a skill, get a skill. Join free.</p>

    <div class="auth-tabs">
      <a href="{{ url_for('login') }}">Log in</a>
      <a href="{{ url_for('signup') }}" class="active">Sign up</a>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text" placeholder="e.g. Aria Sharma"
               value="{{ full_name or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com"
               value="{{ email or '' }}" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="At least 6 characters" required>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" placeholder="Repeat your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>

{% endblock %}
