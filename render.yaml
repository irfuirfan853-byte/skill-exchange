services:
  - type: web
    name: skill-exchange
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCmd: python setup_sqlite.py && python seed_demo_sqlite.py && waitress-serve --host=0.0.0.0 --port=$PORT --threads=8 app:app
    envVars:
      - key: SE_APP_URL
        sync: false
      - key: SE_SECRET_KEY
        generateValue: true
      - key: SE_COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.8
